<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f2">
  <title>Kho Hàng | Quản lý dữ liệu</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/lucide.min.js"></script>
  <script src="MiengGio.js"></script>
  <script src="VanGio.js"></script>
  <script src="OngGio.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="boxes"></i></div>
        <div><div class="brand-name">Kho Hàng</div><div class="brand-caption">Quản lý dữ liệu sản phẩm</div></div>
      </div>
      <div class="nav-label">Không gian làm việc</div>
      <nav class="nav" aria-label="Các trang">
        <button class="nav-button" data-page="report" aria-current="page"><i data-lucide="chart-no-axes-combined"></i><span>Tạo báo cáo</span></button>
        <button class="nav-button" data-page="add"><i data-lucide="package-plus"></i><span>Thêm sản phẩm</span></button>
        <button class="nav-button" data-page="update"><i data-lucide="file-pen-line"></i><span>Cập nhật sản phẩm</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="local-status"><span class="status-dot"></span><span>Dữ liệu lưu trên thiết bị này</span></div></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><div class="crumb" id="breadcrumb">Tổng quan&nbsp; / &nbsp;Báo cáo</div><div class="topbar-right"><span class="today" id="today"></span><div class="avatar" aria-label="Người dùng">AD</div></div></header>
      <div class="content" id="app"></div>
    </main>
  </div>
  <div id="toast-region" aria-live="polite"></div>
  <script src="script.js" defer></script>
</body>
</html>
